# 模型路由配置。
#
# 设计原则：
#   - 本文件不绑定任何具体模型名 / 供应商 SDK，全部通过 OpenAI-compatible HTTP 接口接入。
#   - 四个 Pentester 并行任务共用同一个 pentester 模型配置。
#   - 审计与报告由程序执行，不配置独立模型角色。
#   - 成本为 0 表示不参与预算统计；run 预算为 0 表示不限制。

# 生产使用 docker-compose 提供的 PostgreSQL；pytest 通过 Repository 注入 SQLite。
# 本地临时测试可通过 --db-url 覆盖为 SQLite。
database_url: "postgresql+psycopg://websec:websec@localhost:5432/websec"
artifacts_dir: "artifacts"

run:
  max_cost_usd: 0
  max_total_tokens: 0
  max_tasks: 120
  max_replans: 8
  max_parallel: 4

roles:
  pentester:
    provider: openai_compatible
    model: "nvidia/nemotron-3.5-super-vl:free"
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "WEBSEC_OPENROUTER_KEY"
    temperature: 0.2
    max_output_tokens: 8192
    context_window_tokens: 1000000
    input_cost_per_mtok: 0
    output_cost_per_mtok: 0
