# 作用域策略：无限制模式。
#
# unrestricted: true —— 取消 host 白名单、端口白名单与私网/回环拦截。
#   * 302 跳转到其他 host / 端口不再触发 scope_violation，任务不会中断；
#   * 目标归属由「项目」管理（一个项目可以挂多个 URL），不再依赖 URL 白名单；
#   * 仅 http/https 协议仍然被要求（非 HTTP 工具参数不做拦截）。
#
# 如需切回白名单模式：把 unrestricted 设为 false，并填充 allowed_hosts。
unrestricted: true

allowed_hosts: []

denied_hosts: []

# 无限制模式下该字段不再生效（保留以便切回白名单模式）。
allow_private: true

# 空列表表示任意端口。
allowed_ports: []
