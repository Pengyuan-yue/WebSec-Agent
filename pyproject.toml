[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "websec-agent"
version = "0.1.0"
description = "Scope-guarded multi-agent web security assessment harness"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
browser = ["playwright>=1.44"]
tools = ["arjun>=2.2"]
dev = ["pytest>=8.0"]

[project.scripts]
websec-agent = "websec_agent.cli:main"
websec-agent-web = "websec_agent.webapp:serve"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
