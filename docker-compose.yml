services:
  db:
    # pgvector 预编译镜像，供 memories.embedding 后续使用向量索引
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: websec
      POSTGRES_PASSWORD: websec
      POSTGRES_DB: websec
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U websec -d websec"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
